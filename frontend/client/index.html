<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КОСТЮЧЕНКО</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://js.stripe.com/v3/"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #000000;
            --btn-bg: #f2f2f2;
            --btn-hover: #e6e6e6;
            --accent: #d90000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            animation: fadeUp 0.8s ease forwards;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--accent);
            text-align: center;
            margin: 1.5rem 0;
            letter-spacing: 0.02em;
        }

        .pill-element {
            width: 100%;
            background-color: var(--btn-bg);
            border: none;
            border-radius: 50px;
            padding: 1.2rem 1.5rem;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-main);
            text-align: center;
            transition: background-color 0.2s ease, transform 0.1s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .pill-element:hover {
            background-color: var(--btn-hover);
        }

        .pill-element:active {
            transform: scale(0.98);
        }

        input.pill-element {
            cursor: text;
        }

        input.pill-element::placeholder {
            color: #888;
        }

        input.pill-element:focus {
            outline: 2px solid var(--text-main);
            background-color: #fff;
        }

        .file-upload-wrapper {
            width: 100%;
            position: relative;
        }

        .file-upload-input {
            width: 0.1px;
            height: 0.1px;
            opacity: 0;
            overflow: hidden;
            position: absolute;
            z-index: -1;
        }

        .file-upload-label {
            margin: 0;
        }

        .file-upload-label svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .submit-btn {
            margin-top: 1rem;
            background-color: var(--text-main);
            color: #ffffff;
        }

        .submit-btn:hover {
            background-color: #333;
        }

        .submit-btn:disabled {
            background-color: #ccc;
            color: #888;
            cursor: not-allowed;
            transform: none;
        }

        #error-msg {
            color: var(--accent);
            font-weight: 700;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 0.5rem;
            text-transform: uppercase;
        }

        .price-tag {
            cursor: default;
            pointer-events: none;
            background-color: transparent;
            font-size: 1.2rem;
            margin-bottom: -0.5rem;
        }

        /* Stripe UI */
        #payment-container {
            display: none;
            width: 100%;
            background: #fff;
            padding: 1.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            margin-top: 1rem;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Надіслати звук</h1>

        <form id="donation-form" style="width: 100%; display: flex; flex-direction: column; gap: 1rem;">

            <div class="pill-element price-tag">Вартість: 5 ₴ (Тест)</div>

            <!-- Звичайні поля -->
            <div id="data-fields" style="display: flex; flex-direction: column; gap: 1rem; width: 100%;">
                <input type="text" id="name" class="pill-element" placeholder="ВАШЕ ІМ'Я" required autocomplete="off">
                <input type="text" id="message" class="pill-element" placeholder="ПОВІДОМЛЕННЯ (НЕОБОВ'ЯЗКОВО)"
                    autocomplete="off">
                <div style="display: flex; gap: 10px; width: 100%;">
                    <div class="file-upload-wrapper" style="flex: 1;">
                        <input type="file" id="audio" class="file-upload-input" accept=".mp3, .wav, .ogg, audio/*">
                        <label for="audio" class="pill-element file-upload-label" id="file-label-text">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z" />
                            </svg>
                            <span>ОБРАТИ АУДІО (ДО 20С)</span>
                        </label>
                    </div>
                    <button type="button" id="record-btn" class="pill-element" style="flex: 1; padding: 0; background: var(--text-main); color: white; display: flex; align-items: center; justify-content: center; gap: 8px;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
                        ЗАПИС (ДО 20С)
                    </button>
                </div>
            </div>

            <!-- Stripe Контейнер -->
            <div id="payment-container">
                <div id="payment-element"></div>
            </div>

            <button type="submit" class="pill-element submit-btn" id="submit-btn">Продовжити</button>
            <div id="error-msg"></div>
        </form>
    </div>

    <script>
        // === НАЛАШТУВАННЯ ===
        const API_URL = '/api';
        let stripe;
        let elements;

        async function init() {
            try {
                // Config
                const resConfig = await fetch(`${API_URL}/config`);
                const dataConfig = await resConfig.json();
                if (dataConfig.stripePublicKey) {
                    stripe = Stripe(dataConfig.stripePublicKey);
                }

                // Status limit check
                const resStatus = await fetch(`${API_URL}/status`);
                const dataStatus = await resStatus.json();
                if (dataStatus.count >= 100) {
                    const btn = document.getElementById('submit-btn');
                    btn.innerText = 'ЛІМІТ ВИЧЕРПАНО (100/100)';
                    btn.disabled = true;
                    btn.style.background = '#888';
                    btn.style.color = '#fff';
                    btn.style.cursor = 'not-allowed';
                    document.getElementById('audio').disabled = true;
                    document.getElementById('name').disabled = true;
                    document.getElementById('message').disabled = true;
                }
            } catch (err) {
                console.error('Failed to load init data', err);
            }
        }
        init();

        // === DOM ЕЛЕМЕНТИ ===
        const form = document.getElementById('donation-form');
        const submitBtn = document.getElementById('submit-btn');
        const errorMsg = document.getElementById('error-msg');
        const fileInput = document.getElementById('audio');
        const fileLabel = document.getElementById('file-label-text').querySelector('span');
        const dataFields = document.getElementById('data-fields');
        const paymentContainer = document.getElementById('payment-container');
        const nameInput = document.getElementById('name');
        const messageInput = document.getElementById('message');
        const recordBtn = document.getElementById('record-btn');

        let stripeMode = false;
        let recordedFile = null;

        // UI Файлу
        function handleFileSelection(file) {
            if (file) {
                const fileName = file.name;
                const shortName = fileName.length > 20 ? fileName.substring(0, 17) + '...' : fileName;
                fileLabel.innerText = shortName.toUpperCase();
            } else {
                fileLabel.innerText = 'ОБРАТИ АУДІО (ДО 20С)';
            }
        }

        fileInput.addEventListener('change', function (e) {
            if(fileInput.files.length > 0) {
                recordedFile = null; // Зкидаємо запис, якщо обрали файл вручну
            }
            handleFileSelection(fileInput.files[0]);
        });

        // Мікрофон
        let mediaRecorder;
        let audioChunks = [];
        let recordingInterval;
        let recordingTime = 0;

        recordBtn.addEventListener('click', async () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                recordingTime = 0;

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    clearInterval(recordingInterval);
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    recordedFile = new File([audioBlob], "recorded_audio.webm", { type: 'audio/webm' });
                    fileInput.value = ''; // очищаємо файл інпут
                    
                    recordBtn.innerHTML = `
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
                        ЗАПИС (ДО 20С)
                    `;
                    recordBtn.style.background = 'var(--text-main)';
                    
                    fileLabel.querySelector('span').innerText = `ГОЛОСОВИЙ ЗАПИС (${recordingTime}С)`;
                    
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                recordBtn.innerText = '🛑 0с';
                recordBtn.style.background = 'var(--accent)';
                
                recordingInterval = setInterval(() => {
                    recordingTime++;
                    if (recordingTime >= 20) {
                        mediaRecorder.stop();
                    } else {
                        recordBtn.innerText = `🛑 ${recordingTime}с`;
                    }
                }, 1000);
            } catch (err) {
                alert('Помилка доступу до мікрофону: ' + err.message);
            }
        });

        // Drag and Drop
        const dropZone = document.querySelector('.file-upload-wrapper');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            fileLabel.style.opacity = '0.5';
            fileLabel.style.outline = '2px dashed #e60000';
        }

        function unhighlight(e) {
            fileLabel.style.opacity = '1';
            fileLabel.style.outline = 'none';
        }

        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;

            if (files.length > 0) {
                fileInput.files = files;
                handleFileSelection(files[0]);
            }
        }

        function showError(msg) { errorMsg.innerText = msg; }

        function getAudioDuration(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const audio = new Audio(url);
                audio.onloadedmetadata = () => { URL.revokeObjectURL(url); resolve(audio.duration); };
                audio.onerror = () => reject('Invalid audio file');
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.innerText = '';

            // Якщо ми вже в режимі Stripe — підтверджуємо платіж
            if (stripeMode) {
                submitBtn.disabled = true;
                submitBtn.innerText = 'ОБРОБКА ПЛАТЕЖУ...';

                const { error } = await stripe.confirmPayment({
                    elements,
                    confirmParams: {
                        return_url: window.location.origin + "/client/success.html",
                    },
                });

                if (error) {
                    showError(error.message);
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'СПЛАТИТИ 5 ₴';
                }
                return;
            }

            // --- ФАЗА 1: ЗАВАНТАЖЕННЯ ДАНИХ І ГЕНЕРАЦІЯ ВІДЖЕТУ STRIPE ---
            const file = recordedFile || fileInput.files[0];
            const name = nameInput.value;
            const message = messageInput.value;

            if (!file) return showError('ОБЕРІТЬ ФАЙЛ АБО ЗАПИШІТЬ ЗВУК!');
            if (!name) return showError('ВВЕДІТЬ ВАШЕ ІМ\'Я!');
            if (file.size > 10 * 1024 * 1024) return showError('ФАЙЛ ЗАНАДТО ВЕЛИКИЙ (МАКС 10MB)');

            submitBtn.disabled = true;
            submitBtn.innerText = 'ПІДГОТОВКА...';

            try {
                // Перевірка
                const duration = await getAudioDuration(file);
                if (duration > 21) { // 21 to allow minor discrepancies over 20s
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'ПРОДОВЖИТИ';
                    return showError('АУДІО ДОВШЕ 20 СЕКУНД!');
                }

                submitBtn.innerText = 'ЗАВАНТАЖЕННЯ...';

                // Відправляємо файл та дані на наш бекенд
                const formData = new FormData();
                formData.append('audio', file);
                formData.append('name', name);
                formData.append('message', message);

                const uploadRes = await fetch(`${API_URL}/upload`, {
                    method: 'POST',
                    body: formData
                });

                if (!uploadRes.ok) {
                    const errData = await uploadRes.json().catch(() => ({}));
                    throw new Error(errData.error || 'Помилка завантаження файлу');
                }
                const uploadData = await uploadRes.json();
                const donationId = uploadData.id;

                submitBtn.innerText = 'ПІДКЛЮЧЕННЯ КАСИ...';

                // Отримуємо секрет від Stripe
                const stripeRes = await fetch(`${API_URL}/create-payment-intent`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ donation_id: donationId }),
                });

                if (!stripeRes.ok) throw new Error('Помилка генерації платежу');
                const { clientSecret } = await stripeRes.json();

                // Ховаємо інпути, показуємо Stripe
                dataFields.style.display = 'none';
                paymentContainer.style.display = 'block';

                // --- РЕАЛЬНИЙ STRIPE КОД ---
                elements = stripe.elements({ clientSecret });
                const paymentElement = elements.create('payment', { layout: 'accordion' });
                paymentElement.mount('#payment-element');

                submitBtn.innerText = 'СПЛАТИТИ 5 ₴';
                submitBtn.disabled = false;
                stripeMode = true;

            } catch (err) {
                console.error(err);
                showError(err.message || 'ПОМИЛКА. СПРОБУЙТЕ ЩЕ РАЗ.');
                submitBtn.disabled = false;
                submitBtn.innerText = 'ПРОДОВЖИТИ';
            }
        });
    </script>
</body>

</html>
