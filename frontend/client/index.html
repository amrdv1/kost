<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Надіслати звук - KOSTIUCHENKO</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://js.stripe.com/v3/"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #000000;
            --btn-bg: #f2f2f2;
            --btn-hover: #e6e6e6;
            --accent: #d90000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            animation: fadeUp 0.8s ease forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--accent);
            text-align: center;
            margin: 1.5rem 0;
            letter-spacing: 0.02em;
        }

        .pill-element {
            width: 100%;
            background-color: var(--btn-bg);
            border: none;
            border-radius: 50px;
            padding: 1.2rem 1.5rem;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-main);
            text-align: center;
            transition: background-color 0.2s ease, transform 0.1s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .pill-element:hover { background-color: var(--btn-hover); }
        .pill-element:active { transform: scale(0.98); }

        input.pill-element { cursor: text; }
        input.pill-element::placeholder { color: #888; }
        input.pill-element:focus {
            outline: 2px solid var(--text-main);
            background-color: #fff;
        }

        .file-upload-wrapper { width: 100%; position: relative; }
        .file-upload-input { width: 0.1px; height: 0.1px; opacity: 0; overflow: hidden; position: absolute; z-index: -1; }
        .file-upload-label { margin: 0; }
        .file-upload-label svg { width: 16px; height: 16px; fill: currentColor; }

        .submit-btn {
            margin-top: 1rem;
            background-color: var(--text-main);
            color: #ffffff;
        }
        .submit-btn:hover { background-color: #333; }
        .submit-btn:disabled {
            background-color: #ccc;
            color: #888;
            cursor: not-allowed;
            transform: none;
        }

        #error-msg {
            color: var(--accent);
            font-weight: 700;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 0.5rem;
            text-transform: uppercase;
        }
        
        .price-tag {
            cursor: default;
            pointer-events: none;
            background-color: transparent;
            font-size: 1.2rem;
            margin-bottom: -0.5rem;
        }

        /* Stripe UI */
        #payment-container {
            display: none;
            width: 100%;
            background: #fff;
            padding: 1.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-top: 1rem;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Надіслати звук</h1>

        <form id="donation-form" style="width: 100%; display: flex; flex-direction: column; gap: 1rem;">
            
            <div class="pill-element price-tag">Вартість: 500 ₴</div>

            <!-- Звичайні поля -->
            <div id="data-fields" style="display: flex; flex-direction: column; gap: 1rem; width: 100%;">
                <input type="text" id="name" class="pill-element" placeholder="ВАШЕ ІМ'Я" required autocomplete="off">
                <input type="text" id="message" class="pill-element" placeholder="ПОВІДОМЛЕННЯ (НЕОБОВ'ЯЗКОВО)" autocomplete="off">
                <div class="file-upload-wrapper">
                    <input type="file" id="audio" class="file-upload-input" accept=".mp3, .wav, .ogg, audio/*" required>
                    <label for="audio" class="pill-element file-upload-label" id="file-label-text">
                        <svg viewBox="0 0 24 24"><path d="M12 2v12l-4-4-1.4 1.4L12 17.8l5.4-5.4L16 11l-4 4V2z M4 20v2h16v-2z"/></svg>
                        <span>ОБРАТИ АУДІО (ДО 20 СЕК)</span>
                    </label>
                </div>
            </div>

            <!-- Stripe Контейнер -->
            <div id="payment-container">
                <div id="payment-element"></div>
            </div>

            <button type="submit" class="pill-element submit-btn" id="submit-btn">Продовжити</button>
            <div id="error-msg"></div>
        </form>
    </div>

    <script>
        // === НАЛАШТУВАННЯ ===
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        // const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const STRIPE_PUBLIC_KEY = 'pk_test_YOUR_STRIPE_KEY';
        const stripe = Stripe(STRIPE_PUBLIC_KEY);
        let elements;

        const API_URL = '/api'; // Тепер бекенд і фронтенд на одному сервері!

        // === DOM ЕЛЕМЕНТИ ===
        const form = document.getElementById('donation-form');
        const submitBtn = document.getElementById('submit-btn');
        const errorMsg = document.getElementById('error-msg');
        const fileInput = document.getElementById('audio');
        const fileLabel = document.getElementById('file-label-text').querySelector('span');
        const dataFields = document.getElementById('data-fields');
        const paymentContainer = document.getElementById('payment-container');
        
        let stripeMode = false;

        // UI Файлу
        fileInput.addEventListener('change', function(e) {
            const fileName = e.target.value.split('\\').pop();
            if (fileName) {
                const shortName = fileName.length > 20 ? fileName.substring(0, 17) + '...' : fileName;
                fileLabel.innerText = shortName.toUpperCase();
            } else {
                fileLabel.innerText = 'ОБРАТИ АУДІО (ДО 20 СЕК)';
            }
        });

        function showError(msg) { errorMsg.innerText = msg; }

        function getAudioDuration(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const audio = new Audio(url);
                audio.onloadedmetadata = () => { URL.revokeObjectURL(url); resolve(audio.duration); };
                audio.onerror = () => reject('Invalid audio file');
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.innerText = '';

            // Якщо ми вже в режимі Stripe — підтверджуємо платіж
            if (stripeMode) {
                submitBtn.disabled = true;
                submitBtn.innerText = 'ОБРОБКА ПЛАТЕЖУ...';
                
                const { error } = await stripe.confirmPayment({
                    elements,
                    confirmParams: {
                        // URL куди перекине після оплати
                        return_url: window.location.origin + "/client/success.html", 
                    },
                });

                if (error) {
                    showError(error.message);
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'СПЛАТИТИ 500 ₴';
                }
                return;
            }

            // --- ФАЗА 1: ЗАВАНТАЖЕННЯ ДАНИХ І ГЕНЕРАЦІЯ ВІДЖЕТУ STRIPE ---
            const file = fileInput.files[0];
            if (!file) return showError('ОБЕРІТЬ ФАЙЛ!');
            if (file.size > 10 * 1024 * 1024) return showError('ФАЙЛ ЗАНАДТО ВЕЛИКИЙ (МАКС 10MB)');

            submitBtn.disabled = true;
            submitBtn.innerText = 'ПІДГОТОВКА...';

            try {
                // Перевірка
                const duration = await getAudioDuration(file);
                if (duration > 20) {
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'ПРОДОВЖИТИ';
                    return showError('АУДІО ДОВШЕ 20 СЕКУНД!');
                }

                submitBtn.innerText = 'ЗАВАНТАЖЕННЯ...';

                // =====================================
                // ТУТ ВАШ КОД SUPABASE (ЯК БУВ РАНІШЕ)
                // =====================================
                // const { data: publicUrlData } = ...
                // const { data: dbData } = await supabase.insert(...)
                // const donationId = dbData.id;
                
                // Демо ID
                const donationId = 'demo-uuid-12345';

                // =====================================
                // ОТРИМАННЯ СЕКРЕТА ВІД STRIPE (БЕКЕНД)
                // =====================================
                /* 
                const response = await fetch(`${API_URL}/create-payment-intent`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: 500, currency: 'uah', donation_id: donationId }),
                });
                const { clientSecret } = await response.json();
                */

                // Імітація
                setTimeout(() => {
                    const clientSecret = 'demo_secret'; // Видалити в проді

                    // Ховаємо інпути, показуємо Stripe
                    dataFields.style.display = 'none';
                    paymentContainer.style.display = 'block';
                    
                    /* РЕАЛЬНИЙ STRIPE КОД
                    elements = stripe.elements({ clientSecret });
                    const paymentElement = elements.create('payment', {
                        layout: 'accordion'
                    });
                    paymentElement.mount('#payment-element');
                    */
                    
                    document.getElementById('payment-element').innerHTML = "<p style='text-align:center; padding: 2rem; color: #888;'>[Віджет Stripe Apple Pay / Картки]</p>";

                    submitBtn.innerText = 'СПЛАТИТИ 500 ₴';
                    submitBtn.disabled = false;
                    stripeMode = true;
                }, 1000);

            } catch (err) {
                console.error(err);
                showError('ПОМИЛКА. СПРОБУЙТЕ ЩЕ РАЗ.');
                submitBtn.disabled = false;
                submitBtn.innerText = 'ПРОДОВЖИТИ';
            }
        });
    </script>
</body>
</html>
