<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата успішна - KOSTIUCHENKO</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #000000;
            --accent: #d90000;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 1.5rem;
            overflow: hidden;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: var(--accent);
            text-transform: uppercase;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 900;
        }

        p {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 2rem;
        }

        .btn {
            background-color: var(--text-main);
            color: var(--bg-color);
            padding: 1.2rem;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            text-decoration: none;
            display: inline-block;
            transition: opacity 0.2s ease;
        }

        .btn:hover {
            opacity: 0.8;
        }

        .check-icon {
            width: 100px;
            height: 100px;
            fill: var(--accent);
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="container" id="content-container">
        <!-- Default State (Loading or Parsing) -->
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const redirectStatus = urlParams.get('redirect_status');
        const container = document.getElementById('content-container');

        if (redirectStatus === 'succeeded' || redirectStatus === 'processing') {
            container.innerHTML = `
                <svg class="check-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
                </svg>
                <h1>ОПЛАТА УСПІШНА!</h1>
                <a href="/" class="btn">НАДІСЛАТИ ЩЕ ОДИН ЗВУК</a>
            `;
        } else {
            container.innerHTML = `
                <svg class="check-icon" viewBox="0 0 24 24" style="fill: var(--text-main);">
                    <path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z" />
                </svg>
                <h1 style="color: var(--text-main);">ОПЛАТА НЕ ВДАЛАСЯ</h1>
                <p style="font-weight: 700; margin-bottom: 2rem;">Платіж було скасовано або виникла помилка. Гроші не списано.</p>
                <a href="/" class="btn">СПРОБУВАТИ ЩЕ РАЗ</a>
            `;
        }
    </script>
</body>

</html>
