<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Overlay - KOSTIUCHENKO</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #ffffff;
            --border: rgba(255, 255, 255, 0.15);
        }

        body {
            background-color: var(--bg-color); /* Streamers can chroma-key this or we can add OBS transparency */
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }

        /* Toggles transparency for OBS */
        body.obs-mode {
            background-color: transparent !important;
        }
        body.obs-mode::before { display: none; }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 0%, rgba(30,30,30,0.6) 0%, rgba(5,5,5,1) 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* --- ALERTS CONTAINER --- */
        #alert-container {
            position: fixed;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 100;
        }

        .alert-box {
            background: rgba(10, 10, 10, 0.9);
            border: 2px solid var(--accent);
            border-radius: 20px;
            padding: 20px 40px;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.2);
            text-align: center;
            opacity: 0;
            transform: translateY(50px);
            animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            min-width: 400px;
            max-width: 80vw;
        }

        .alert-box.sound-alert {
            border-color: #ff0000;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.5);
        }

        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(-30px); }
        }

        .alert-box.hiding {
            animation: fadeOut 0.5s ease forwards;
        }

        .alert-amount {
            font-size: 3rem;
            font-weight: 900;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            margin-bottom: -10px;
        }
        
        .alert-box.sound-alert .alert-amount {
            color: #ff0000;
            text-shadow: 0 0 20px rgba(255,0,0,0.8);
        }

        .alert-name {
            font-size: 2rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .alert-message {
            font-size: 1.2rem;
            font-weight: 300;
            margin-top: 10px;
            font-style: italic;
            color: #ddd;
        }

        /* --- HISTORY DRAWER --- */
        #history-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            z-index: 200;
            transition: background 0.2s;
        }
        #history-btn:hover { background: rgba(255,255,255,0.2); }

        #history-drawer {
            position: fixed;
            top: 0; right: -400px;
            width: 400px; height: 100vh;
            background: rgba(10,10,10,0.95);
            border-left: 1px solid var(--border);
            z-index: 150;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            padding: 20px;
        }
        #history-drawer.open { right: 0; }

        #history-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 60px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .history-item {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid var(--border);
        }
        .history-item.sound { border-left-color: #ff0000; }
        .history-item.normal { border-left-color: var(--accent); }

        .history-item .amt { font-weight: 900; font-size: 1.2rem; }
        .history-item .nm { font-weight: 700; }
        .history-item .msg { font-size: 0.9rem; color: #aaa; margin-top: 5px; }

    </style>
</head>
<body>

    <button id="history-btn" onclick="toggleHistory()">ІСТОРІЯ ДОНАТІВ</button>

    <!-- Settings (Bottom Left) -->
    <div style="position: fixed; bottom: 20px; left: 20px; z-index: 100; display: flex; gap: 10px; opacity: 0.2; transition: opacity 0.2s;">
        <div class="settings-hover" style="background: rgba(0,0,0,0.8); padding: 10px; border-radius: 10px; border: 1px solid var(--border);">
            <label style="font-size: 12px; font-weight: 700;">ГУЧНІСТЬ</label><br>
            <input type="range" id="master-volume" min="0" max="100" value="100">
            <br>
            <label style="font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 5px; margin-top: 10px; cursor: pointer;">
                <input type="checkbox" id="obs-toggle" onchange="document.body.classList.toggle('obs-mode')">
                ПРОЗОРИЙ ФОН (ОБС)
            </label>
        </div>
    </div>

    <!-- Active Alerts Pop Here -->
    <div id="alert-container"></div>

    <!-- History Sidebar -->
    <div id="history-drawer">
        <h2 style="margin:0; text-transform:uppercase;">Історія</h2>
        <div id="history-list"></div>
    </div>

    <script>
        const API_URL = '/api';
        const socket = io();
        let masterVolume = localStorage.getItem('sound_volume') ? parseFloat(localStorage.getItem('sound_volume')) : 1.0;
        
        const volInput = document.getElementById('master-volume');
        volInput.value = masterVolume * 100;
        volInput.addEventListener('input', (e) => {
            masterVolume = e.target.value / 100;
            localStorage.setItem('sound_volume', masterVolume);
        });

        // Hover effect for settings
        document.querySelector('.settings-hover').parentElement.addEventListener('mouseenter', e => e.currentTarget.style.opacity = '1');
        document.querySelector('.settings-hover').parentElement.addEventListener('mouseleave', e => e.currentTarget.style.opacity = '0.2');

        function toggleHistory() {
            document.getElementById('history-drawer').classList.toggle('open');
        }

        // --- WEB AUDIO API FOR NOTIFICATIONS ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSynthAlert(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            
            if (type === 'normal') {
                // High pleasant "ding-ding"
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now); // A5
                osc.frequency.setValueAtTime(1108.73, now + 0.15); // C#6
                
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(masterVolume * 0.5, now + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
                
                osc.start(now);
                osc.stop(now + 1);
            } else if (type === 'sound') {
                // Epic deep impact
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.5);
                
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(masterVolume * 0.8, now + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 1.5);
                
                osc.start(now);
                osc.stop(now + 1.5);
            }
        }

        // --- ALERT QUEUE & RENDER ---
        let alertQueue = [];
        let isAlerting = false;

        function processQueue() {
            if (isAlerting || alertQueue.length === 0) return;
            
            isAlerting = true;
            const data = alertQueue.shift();
            const isSoundDonation = data.amount >= 500;
            
            // Render UI
            const container = document.getElementById('alert-container');
            const box = document.createElement('div');
            box.className = `alert-box ${isSoundDonation ? 'sound-alert' : ''}`;
            
            box.innerHTML = `
                <div class="alert-amount">${data.amount} ₴</div>
                <div class="alert-name">${data.customer_name || data.name}</div>
                ${data.message ? `<div class="alert-message">"${data.message}"</div>` : ''}
            `;
            container.appendChild(box);

            // Play specific synth sound
            playSynthAlert(isSoundDonation ? 'sound' : 'normal');

            // If it's a sound donation, play the recorded audio after synth finishes (~1.5s)
            if (isSoundDonation && data.audio_base64) {
                setTimeout(() => {
                    const audioSource = `data:${data.audio_type};base64,${data.audio_base64}`;
                    const customAudio = new Audio(audioSource);
                    customAudio.volume = masterVolume;
                    customAudio.play().catch(e => console.error("Audio play failed:", e));
                }, 1500);
            }

            // Keep on screen for 20 seconds, then fade out
            setTimeout(() => {
                box.classList.add('hiding');
                setTimeout(() => {
                    box.remove();
                    isAlerting = false;
                    processQueue();
                }, 500); // match fadeOut animation duration
            }, 20000);
            
            // Add to history
            addToHistory(data, isSoundDonation);
        }

        function addToHistory(data, isSound) {
            const list = document.getElementById('history-list');
            const div = document.createElement('div');
            div.className = `history-item ${isSound ? 'sound' : 'normal'}`;
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between;">
                    <span class="nm">${data.customer_name || data.name}</span>
                    <span class="amt">${data.amount} ₴</span>
                </div>
                ${data.message ? `<div class="msg">${data.message}</div>` : ''}
                ${isSound && data.audio_base64 ? `
                    <button style="margin-top: 10px; background: #333; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer;"
                            onclick="new Audio('data:${data.audio_type};base64,${data.audio_base64}').play()">
                        СЛУХАТИ ЗВУК
                    </button>
                ` : ''}
            `;
            list.prepend(div);
        }

        socket.on('play_sound', (data) => {
            console.log("New donation received!", data);
            alertQueue.push(data);
            processQueue();
        });

        // Fetch initial history
        async function loadHistory() {
            try {
                const res = await fetch(`${API_URL}/live/history`);
                const sounds = await res.json();
                
                // Load them quietly into the history drawer (don't play sounds)
                sounds.reverse().forEach(sound => {
                    addToHistory(sound, sound.amount >= 500);
                });
            } catch (err) {
                console.error("Failed to load history", err);
            }
        }

        loadHistory();

        // Initialize user interaction for AudioContext (browsers block audio until click)
        document.body.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }, { once: true });

    </script>
</body>
</html>
