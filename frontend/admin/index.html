<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Moderation - KOSTIUCHENKO</title>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #000000;
            --btn-bg: #f2f2f2;
            --accent: #d90000;
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            padding: 0; 
            margin: 0; 
            background: var(--bg-color); 
            color: var(--text-main);
        }
        
        #login-screen { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            background: var(--bg-color); 
        }
        
        #login-screen h1 {
            color: var(--accent);
            text-transform: uppercase;
            font-weight: 900;
            font-size: 2.5rem;
            margin-bottom: 2rem;
        }

        #login-screen input { 
            padding: 1.2rem; 
            margin: 0.5rem; 
            width: 320px; 
            background: var(--btn-bg);
            border: none; 
            border-radius: 50px; 
            font-size: 1rem; 
            font-family: 'Montserrat', sans-serif;
            font-weight: 700; 
            text-align: center;
            outline: none;
        }
        
        #login-screen button { 
            padding: 1.2rem; 
            width: 360px; 
            background: var(--text-main); 
            color: var(--bg-color); 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            font-family: 'Montserrat', sans-serif;
            font-weight: 900; 
            font-size: 1.2rem; 
            margin-top: 1rem; 
            text-transform: uppercase;
            transition: opacity 0.2s;
        }

        #login-screen button:hover {
            opacity: 0.8;
        }

        #admin-panel { 
            display: none; 
            max-width: 800px;
            margin: 0 auto;
            padding: 3rem 1rem; 
        }

        #admin-panel h1 {
            color: var(--accent);
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        #admin-panel > p {
            text-align: center;
            font-weight: 700;
            margin-bottom: 3rem;
        }
        
        .card { 
            background: var(--btn-bg); 
            padding: 1.5rem; 
            margin-bottom: 1.5rem; 
            border-radius: 20px; 
        }

        .card p {
            font-weight: 700;
            margin: 0.5rem 0;
            font-size: 1.1rem;
        }

        .actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn { 
            flex: 1;
            padding: 1rem; 
            cursor: pointer; 
            border: none; 
            border-radius: 50px; 
            color: var(--bg-color); 
            font-family: 'Montserrat', sans-serif;
            font-weight: 900; 
            font-size: 1.1rem; 
            text-transform: uppercase;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.8; }
        .btn-approve { background: var(--text-main); }
        .btn-reject { background: var(--accent); }

        /* Кастомізація аудіо плеєра */
        audio {
            width: 100%;
            margin-top: 1rem;
            border-radius: 50px;
        }

        /* САУНДБОРД */
        .soundboard-section {
            margin-top: 4rem;
            border-top: 4px solid var(--text-main);
            padding-top: 2rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 2rem;
        }

        .sound-btn {
            background: var(--text-main);
            color: var(--bg-color);
            border: none;
            padding: 1.5rem;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            transition: transform 0.1s, opacity 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 120px;
        }

        .sound-btn:active {
            transform: scale(0.95);
        }

        .sound-btn:hover {
            opacity: 0.8;
        }

        .sound-btn .name {
            font-weight: 900;
            font-size: 1.2rem;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .sound-btn .message {
            font-weight: 700;
            font-size: 0.9rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Socket.io -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- ЕКРАН ЛОГІНУ -->
    <div id="login-screen">
        <h1 style="color: #d90000; margin-bottom: 2rem;">ВХІД (АДМІН)</h1>
        <input type="text" id="username" placeholder="Логін">
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="login()">УВІЙТИ</button>
        <p id="login-error" style="color: #d90000; margin-top: 1rem; display: none;">Невірний логін або пароль!</p>
    </div>

    <!-- АДМІН ПАНЕЛЬ -->
    <div id="admin-panel">
        <h1>МОДЕРАЦІЯ ЗВУКІВ</h1>
        <p>Ці звуки оплачені і чекають вашого підтвердження.</p>
        <div id="donations">
            <p style="text-align: center; font-weight: 700;">Завантаження...</p>
        </div>

        <div class="soundboard-section">
            <h1>ВАШ САУНДБОРД</h1>
            <p>Усі схвалені звуки з'являються тут. Натискайте, щоб відтворити!</p>
            <div class="grid" id="sound-grid">
                <!-- Звуки будуть тут -->
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';

        // Listen for realtime updates
        const socket = io();
        socket.on('connect', () => {
            socket.emit('join_admin');
        });

        socket.on('new_donation_pending', () => {
            alert('NEW DONATION PAID! Reloading...');
            loadPending();
        });

        function getAuthHeader() {
            return { 'Authorization': 'Bearer ' + localStorage.getItem('admin_token') };
        }

        function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if (u.trim().toLowerCase() === 'костюченко' && p.trim() !== '') {
                localStorage.setItem('admin_token', p.trim());
                loadPending();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        async function loadPending() {
            try {
                const res = await fetch(`${API_URL}/admin/pending`, { headers: getAuthHeader() });
                
                if (res.status === 401) {
                    // Unauthorized
                    document.getElementById('login-screen').style.display = 'flex';
                    document.getElementById('admin-panel').style.display = 'none';
                    document.getElementById('login-error').style.display = 'block';
                    localStorage.removeItem('admin_token');
                    return;
                }

                // Authorized
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                document.getElementById('login-error').style.display = 'none';

                const donations = await res.json();
                
                const container = document.getElementById('donations');
                container.innerHTML = '';
                
                if(donations.length === 0) {
                    container.innerHTML = '<p style="text-align: center; font-weight: 700; color: #888;">Немає нових звуків для модерації.</p>';
                    return;
                }

                donations.forEach(donation => {
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `
                        <p style="color: var(--accent); font-size: 1.2rem;">${donation.amount} ₴</p>
                        <p><strong>ВІД КОГО:</strong> ${donation.customer_name}</p>
                        <p><strong>ПОВІДОМЛЕННЯ:</strong> ${donation.message || '—'}</p>
                        <audio controls>
                            <source src="data:${donation.audio_type};base64,${donation.audio_base64}" type="${donation.audio_type}">
                        </audio>
                        <div class="actions">
                            <button class="btn btn-approve" onclick="moderate('${donation.id}', 'APPROVED')">СХВАЛИТИ</button>
                            <button class="btn btn-reject" onclick="moderate('${donation.id}', 'REJECTED')">ВІДХИЛИТИ</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                console.error("Failed to load", err);
            }
        }

        async function moderate(id, status) {
            try {
                const res = await fetch(`${API_URL}/admin/moderate`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        ...getAuthHeader()
                    },
                    body: JSON.stringify({ donation_id: id, status })
                });
                
                if (res.status === 401) {
                    alert('Сесія закінчилась. Увійдіть ще раз.');
                    loadPending();
                    return;
                }

                if(res.ok) {
                    loadPending();
                    loadSoundboard();
                } else {
                    alert('Помилка сервера');
                }
            } catch (err) {
                console.error(err);
            }
        }

        // САУНДБОРД
        async function loadSoundboard() {
            try {
                const res = await fetch(`${API_URL}/live/history`); // публічний ендпоінт, не потребує токена
                const sounds = await res.json();
                const grid = document.getElementById('sound-grid');
                grid.innerHTML = '';

                if (sounds.length === 0) {
                    grid.innerHTML = '<p style="text-align: center; grid-column: 1 / -1; color: #888; font-weight: 700;">Саундборд порожній. Схваліть перший звук!</p>';
                    return;
                }

                sounds.forEach(sound => {
                    const btn = document.createElement('button');
                    btn.className = 'sound-btn';
                    btn.innerHTML = `
                        <div class="name">${sound.customer_name}</div>
                        <div class="message">${sound.message || ''}</div>
                    `;
                    
                    const audioSource = `data:${sound.audio_type};base64,${sound.audio_base64}`;
                    btn.onclick = () => {
                        const audio = new Audio(audioSource);
                        audio.play();
                    };
                    grid.appendChild(btn);
                });
            } catch (err) {
                console.error("Failed to load soundboard", err);
            }
        }

        // Check if already logged in on load
        if (localStorage.getItem('admin_token')) {
            loadPending();
            loadSoundboard();
        }
    </script>
</body>
</html>
