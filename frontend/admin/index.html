<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOSTIUCHENKO SOUNDBOARD</title>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <!-- Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #000000;
            --btn-bg: #f2f2f2;
            --accent: #d90000;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            padding: 0; 
            margin: 0; 
            background: var(--bg-color); 
            color: var(--text-main);
            overflow-x: hidden;
        }
        
        /* ЕКРАН ЛОГІНУ */
        #login-screen { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            padding: 2rem;
            background: var(--bg-color);
        }
        
        #login-screen h1 {
            color: var(--accent);
            text-transform: uppercase;
            font-weight: 900;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        #login-screen input { 
            padding: 1.2rem; 
            margin: 0.5rem; 
            width: 100%; 
            max-width: 320px;
            background: var(--btn-bg);
            color: var(--text-main);
            border: none; 
            border-radius: 50px; 
            font-size: 1rem; 
            font-family: 'Montserrat', sans-serif;
            font-weight: 700; 
            text-align: center;
            outline: none;
            transition: opacity 0.3s;
        }

        #login-screen input:focus {
            opacity: 0.8;
        }
        
        #login-screen button { 
            padding: 1.2rem; 
            width: 100%; 
            max-width: 320px;
            background: var(--text-main); 
            color: var(--bg-color); 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            font-family: 'Montserrat', sans-serif;
            font-weight: 900; 
            font-size: 1.2rem; 
            margin-top: 1rem; 
            text-transform: uppercase;
            transition: transform 0.1s, opacity 0.2s;
        }

        #login-screen button:hover {
            opacity: 0.8;
        }

        #login-screen button:active {
            transform: scale(0.95);
        }

        /* САУНДБОРД */
        #admin-panel { 
            display: none; 
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1.5rem; 
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
        }

        .header h1 {
            color: var(--accent);
            font-weight: 900;
            text-transform: uppercase;
            font-size: 2.2rem;
            margin: 0 0 0.5rem 0;
        }

        .header p {
            color: var(--text-main);
            font-weight: 700;
            margin: 0;
            font-size: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .sound-btn {
            background: var(--text-main);
            border: none;
            padding: 1.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 140px;
            transition: transform 0.1s, opacity 0.2s;
        }

        .sound-btn:hover {
            opacity: 0.8;
        }

        .sound-btn:active {
            transform: scale(0.95);
        }

        .sound-btn .name {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 0.5rem;
            word-break: break-word;
        }

        .sound-btn .message {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--bg-color);
            word-break: break-word;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-main);
            font-weight: 700;
        }
        
        .empty-state svg {
            width: 64px;
            height: 64px;
            fill: var(--text-main);
            margin-bottom: 1rem;
        }

        /* Анімація нового звуку */
        @keyframes pulseNew {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(217, 0, 0, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 20px 10px rgba(217, 0, 0, 0.4); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(217, 0, 0, 0.4); }
        }

        .new-sound {
            animation: pulseNew 2s infinite;
        }

    </style>
</head>
<body>

    <!-- ЕКРАН ЛОГІНУ -->
    <div id="login-screen">
        <h1>САУНДБОРД</h1>
        <input type="text" id="username" placeholder="Логін" value="костюченко">
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="login()">УВІЙТИ</button>
        <p id="login-error" style="color: var(--accent); margin-top: 1rem; display: none; font-weight: 700;">Невірний пароль!</p>
    </div>

    <!-- АДМІН ПАНЕЛЬ (САУНДБОРД) -->
    <div id="admin-panel">
        <div class="header">
            <h1>LIVE SOUNDBOARD</h1>
            <p>Усі донати з'являтимуться тут і відтворюватимуться автоматично</p>
        </div>
        
        <div class="grid" id="sound-grid">
            <div class="empty-state">Завантаження...</div>
        </div>
    </div>

    <script>
        const API_URL = '/api';

        // Listen for realtime updates
        const socket = io();
        
        // When a new payment is made, it auto-approves and emits this:
        socket.on('new_approved_sound', (sound) => {
            addSoundToGrid(sound, true); // true = isNew, just add button, no autoplay!
        });

        function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if (u.trim().toLowerCase() === 'костюченко' && p.trim() !== '') {
                localStorage.setItem('admin_token', p.trim());
                showBoard();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function showBoard() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            document.getElementById('login-error').style.display = 'none';
            loadSoundboard();
        }

        function playSound(sound) {
            try {
                const audio = new Audio(`data:${sound.audio_type};base64,${sound.audio_base64}`);
                audio.play().catch(e => console.log('Autoplay prevented by browser:', e));
            } catch(e) {
                console.error("Error playing sound", e);
            }
        }

        function addSoundToGrid(sound, isNew = false) {
            const grid = document.getElementById('sound-grid');
            
            // Remove empty state if present
            const emptyState = grid.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const btn = document.createElement('button');
            btn.className = 'sound-btn';
            if (isNew) {
                btn.classList.add('new-sound');
                // Remove animation after 10 seconds
                setTimeout(() => btn.classList.remove('new-sound'), 10000);
            }

            btn.innerHTML = `
                <div class="name">${sound.customer_name}</div>
                <div class="message">${sound.message || ''}</div>
            `;
            
            btn.onclick = () => playSound(sound);

            // Prepend new sounds to the top
            if (grid.firstChild) {
                grid.insertBefore(btn, grid.firstChild);
            } else {
                grid.appendChild(btn);
            }
        }

        async function loadSoundboard() {
            try {
                // Dodated cache-busting to ensure mobile doesn't cache an empty array
                const res = await fetch(`${API_URL}/live/history?t=${new Date().getTime()}`);
                const sounds = await res.json();
                
                const grid = document.getElementById('sound-grid');
                grid.innerHTML = '';

                if (sounds.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.5 0-4.5-2-4.5-4.5h2c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5h2c0 2.5-2 4.5-4.5 4.5zm2-5.5H10V9h4v2z"/></svg>
                            <h3>Поки що тихо</h3>
                            <p>Тут з'являться звуки від ваших глядачів</p>
                        </div>
                    `;
                    return;
                }

                // Sounds come ordered by DESC from DB, so we append them in order
                sounds.forEach(sound => addSoundToGrid(sound, false));
                
            } catch (err) {
                console.error("Failed to load soundboard", err);
            }
        }

        // Check if already logged in on load
        if (localStorage.getItem('admin_token')) {
            showBoard();
        }
    </script>
</body>
</html>
