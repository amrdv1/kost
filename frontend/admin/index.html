<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Moderation - KOSTIUCHENKO</title>
    <!-- Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: 'Montserrat', sans-serif; padding: 0; margin: 0; background: #f4f4f4; }
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #fff; }
        #login-screen input { padding: 1rem; margin: 0.5rem; width: 300px; border: 2px solid #ccc; border-radius: 10px; font-size: 1rem; font-weight: bold; }
        #login-screen button { padding: 1rem; width: 320px; background: #d90000; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1rem; margin-top: 1rem; }
        #admin-panel { display: none; padding: 2rem; }
        
        .card { background: white; padding: 1.5rem; margin-bottom: 1rem; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .btn { padding: 0.8rem 1.5rem; cursor: pointer; border: none; border-radius: 8px; color: white; margin-right: 0.5rem; font-weight: bold; font-size: 1rem; }
        .btn-approve { background: #000; }
        .btn-reject { background: #d90000; }
    </style>
</head>
<body>

    <!-- ЕКРАН ЛОГІНУ -->
    <div id="login-screen">
        <h1 style="color: #d90000; margin-bottom: 2rem;">ВХІД (АДМІН)</h1>
        <input type="text" id="username" placeholder="Логін">
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="login()">УВІЙТИ</button>
        <p id="login-error" style="color: #d90000; margin-top: 1rem; display: none;">Невірний логін або пароль!</p>
    </div>

    <!-- АДМІН ПАНЕЛЬ -->
    <div id="admin-panel">
        <h1>Модерація звуків</h1>
        <p>Звуки, що очікують підтвердження після оплати.</p>
        <div id="donations">Завантаження...</div>
    </div>

    <script>
        const API_URL = '/api';

        // Listen for realtime updates
        const socket = io();
        socket.on('connect', () => {
            socket.emit('join_admin');
        });

        socket.on('new_donation_pending', () => {
            alert('NEW DONATION PAID! Reloading...');
            loadPending();
        });

        function getAuthHeader() {
            return { 'Authorization': 'Bearer ' + localStorage.getItem('admin_token') };
        }

        function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if (u.trim().toLowerCase() === 'костюченко' && p.trim() !== '') {
                localStorage.setItem('admin_token', p.trim());
                loadPending();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        async function loadPending() {
            try {
                const res = await fetch(`${API_URL}/admin/pending`, { headers: getAuthHeader() });
                
                if (res.status === 401) {
                    // Unauthorized
                    document.getElementById('login-screen').style.display = 'flex';
                    document.getElementById('admin-panel').style.display = 'none';
                    document.getElementById('login-error').style.display = 'block';
                    localStorage.removeItem('admin_token');
                    return;
                }

                // Authorized
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                document.getElementById('login-error').style.display = 'none';

                const donations = await res.json();
                
                const container = document.getElementById('donations');
                container.innerHTML = '';
                
                if(donations.length === 0) {
                    container.innerHTML = '<i>No pending donations.</i>';
                    return;
                }

                donations.forEach(donation => {
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `
                        <p><strong>Від кого:</strong> ${donation.customer_name}</p>
                        <p><strong>Сума:</strong> ${donation.amount} ₴</p>
                        <p><strong>Повідомлення:</strong> ${donation.message || '—'}</p>
                        <audio controls style="width: 100%; margin-top: 10px;">
                            <source src="data:${donation.audio_type};base64,${donation.audio_base64}" type="${donation.audio_type}">
                        </audio>
                        <div class="actions">
                            <button class="btn btn-approve" onclick="moderate('${donation.id}', 'APPROVED')">Схвалити</button>
                            <button class="btn btn-reject" onclick="moderate('${donation.id}', 'REJECTED')">Відхилити</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                console.error("Failed to load", err);
            }
        }

        async function moderate(id, status) {
            try {
                const res = await fetch(`${API_URL}/admin/moderate`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        ...getAuthHeader()
                    },
                    body: JSON.stringify({ donation_id: id, status })
                });
                
                if (res.status === 401) {
                    alert('Сесія закінчилась. Увійдіть ще раз.');
                    loadPending();
                    return;
                }

                if(res.ok) {
                    loadPending();
                } else {
                    alert('Помилка сервера');
                }
            } catch (err) {
                console.error(err);
            }
        }

        // Check if already logged in on load
        if (localStorage.getItem('admin_token')) {
            loadPending();
        }
    </script>
</body>
</html>
