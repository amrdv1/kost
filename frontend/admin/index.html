<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOSTIUCHENKO SOUNDBOARD</title>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <!-- Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-main: #ffffff;
            --card-bg: #151515;
            --accent: #ff003c;
            --accent-glow: rgba(255, 0, 60, 0.4);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            padding: 0; 
            margin: 0; 
            background: var(--bg-color); 
            color: var(--text-main);
            overflow-x: hidden;
        }
        
        /* ЕКРАН ЛОГІНУ */
        #login-screen { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            padding: 2rem;
            background: radial-gradient(circle at center, #1a050a 0%, var(--bg-color) 100%);
        }
        
        #login-screen h1 {
            color: var(--accent);
            text-transform: uppercase;
            font-weight: 900;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-align: center;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        #login-screen input { 
            padding: 1.2rem; 
            margin: 0.5rem; 
            width: 100%; 
            max-width: 320px;
            background: rgba(255,255,255,0.05);
            color: white;
            border: 2px solid rgba(255,255,255,0.1); 
            border-radius: 15px; 
            font-size: 1rem; 
            font-family: 'Montserrat', sans-serif;
            font-weight: 700; 
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        #login-screen input:focus {
            border-color: var(--accent);
        }
        
        #login-screen button { 
            padding: 1.2rem; 
            width: 100%; 
            max-width: 320px;
            background: var(--accent); 
            color: white; 
            border: none; 
            border-radius: 15px; 
            cursor: pointer; 
            font-family: 'Montserrat', sans-serif;
            font-weight: 900; 
            font-size: 1.2rem; 
            margin-top: 1rem; 
            text-transform: uppercase;
            box-shadow: 0 10px 20px var(--accent-glow);
            transition: transform 0.1s, box-shadow 0.2s;
        }

        #login-screen button:active {
            transform: scale(0.95);
        }

        /* САУНДБОРД */
        #admin-panel { 
            display: none; 
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1.5rem; 
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header h1 {
            color: var(--accent);
            font-weight: 900;
            text-transform: uppercase;
            font-size: 2.2rem;
            margin: 0 0 0.5rem 0;
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .header p {
            color: #888;
            font-weight: 700;
            margin: 0;
            font-size: 0.9rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .sound-btn {
            background: var(--card-bg);
            border: 2px solid rgba(255,255,255,0.05);
            padding: 1.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 140px;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .sound-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,0,60,0.2) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .sound-btn:hover {
            transform: translateY(-5px);
            border-color: rgba(255,0,60,0.5);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), 0 0 15px var(--accent-glow);
        }

        .sound-btn:hover::before {
            opacity: 1;
        }

        .sound-btn:active {
            transform: translateY(2px) scale(0.95);
        }

        .sound-btn .name {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            text-transform: uppercase;
            color: white;
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 1;
            word-break: break-word;
        }

        .sound-btn .message {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            color: #aaa;
            position: relative;
            z-index: 1;
            word-break: break-word;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 1rem;
            color: #555;
        }
        
        .empty-state svg {
            width: 64px;
            height: 64px;
            fill: #333;
            margin-bottom: 1rem;
        }

        /* Анімація нового звуку */
        @keyframes pulseNew {
            0% { transform: scale(1); box-shadow: 0 0 0 0 var(--accent-glow); }
            50% { transform: scale(1.05); box-shadow: 0 0 20px 10px var(--accent-glow); border-color: var(--accent); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 var(--accent-glow); }
        }

        .new-sound {
            animation: pulseNew 2s infinite;
        }

    </style>
</head>
<body>

    <!-- ЕКРАН ЛОГІНУ -->
    <div id="login-screen">
        <h1>САУНДБОРД</h1>
        <input type="text" id="username" placeholder="Логін" value="костюченко">
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="login()">УВІЙТИ</button>
        <p id="login-error" style="color: var(--accent); margin-top: 1rem; display: none; font-weight: 700;">Невірний пароль!</p>
    </div>

    <!-- АДМІН ПАНЕЛЬ (САУНДБОРД) -->
    <div id="admin-panel">
        <div class="header">
            <h1>LIVE SOUNDBOARD</h1>
            <p>Усі донати з'являтимуться тут і відтворюватимуться автоматично</p>
        </div>
        
        <div class="grid" id="sound-grid">
            <div class="empty-state">Завантаження...</div>
        </div>
    </div>

    <script>
        const API_URL = '/api';

        // Listen for realtime updates
        const socket = io();
        
        // When a new payment is made, it auto-approves and emits this:
        socket.on('new_approved_sound', (sound) => {
            addSoundToGrid(sound, true); // true = isNew, just add button, no autoplay!
        });

        function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if (u.trim().toLowerCase() === 'костюченко' && p.trim() !== '') {
                localStorage.setItem('admin_token', p.trim());
                showBoard();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function showBoard() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            document.getElementById('login-error').style.display = 'none';
            loadSoundboard();
        }

        function playSound(sound) {
            try {
                const audio = new Audio(`data:${sound.audio_type};base64,${sound.audio_base64}`);
                audio.play().catch(e => console.log('Autoplay prevented by browser:', e));
            } catch(e) {
                console.error("Error playing sound", e);
            }
        }

        function addSoundToGrid(sound, isNew = false) {
            const grid = document.getElementById('sound-grid');
            
            // Remove empty state if present
            const emptyState = grid.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const btn = document.createElement('button');
            btn.className = 'sound-btn';
            if (isNew) {
                btn.classList.add('new-sound');
                // Remove animation after 10 seconds
                setTimeout(() => btn.classList.remove('new-sound'), 10000);
            }

            btn.innerHTML = `
                <div class="name">${sound.customer_name}</div>
                <div class="message">${sound.message || ''}</div>
            `;
            
            btn.onclick = () => playSound(sound);

            // Prepend new sounds to the top
            if (grid.firstChild) {
                grid.insertBefore(btn, grid.firstChild);
            } else {
                grid.appendChild(btn);
            }
        }

        async function loadSoundboard() {
            try {
                // Dodated cache-busting to ensure mobile doesn't cache an empty array
                const res = await fetch(`${API_URL}/live/history?t=${new Date().getTime()}`);
                const sounds = await res.json();
                
                const grid = document.getElementById('sound-grid');
                grid.innerHTML = '';

                if (sounds.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.5 0-4.5-2-4.5-4.5h2c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5h2c0 2.5-2 4.5-4.5 4.5zm2-5.5H10V9h4v2z"/></svg>
                            <h3>Поки що тихо</h3>
                            <p>Тут з'являться звуки від ваших глядачів</p>
                        </div>
                    `;
                    return;
                }

                // Sounds come ordered by DESC from DB, so we append them in order
                sounds.forEach(sound => addSoundToGrid(sound, false));
                
            } catch (err) {
                console.error("Failed to load soundboard", err);
            }
        }

        // Check if already logged in on load
        if (localStorage.getItem('admin_token')) {
            showBoard();
        }
    </script>
</body>
</html>
