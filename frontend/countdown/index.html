<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #day-label {
            font-size: 8rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: -1rem;
            letter-spacing: 0.05em;
        }
        #countdown {
            font-size: 14rem;
            font-weight: 900;
            color: #ff0000;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            text-shadow: 0 5px 15px rgba(255, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <!-- Hidden start button: Top Left, small dark gray circle -->
    <div id="start-btn" style="position: absolute; top: 15px; left: 15px; width: 15px; height: 15px; background: #222; border-radius: 50%; cursor: pointer; z-index: 9999;" title="Start 72h Countdown"></div>
    
    <div id="day-label">DAY 1</div>
    <div id="countdown">00:00:00</div>

    <script>
        const dayLabel = document.getElementById('day-label');
        const countdownEl = document.getElementById('countdown');
        const startBtn = document.getElementById('start-btn');

        const DURATION_MS = 72 * 60 * 60 * 1000; // 72 години

        // Запуск по кліку на невидиму кнопку
        startBtn.addEventListener('click', () => {
            // Перезаписуємо час старту тільки якщо користувач точно клікнув
            localStorage.setItem('countdown_start', Date.now());
            // Додаємо візуальний фідбек (кнопка кліпне зеленим)
            startBtn.style.background = '#00ff00';
            setTimeout(() => { startBtn.style.background = '#222'; }, 500);
            updateTimer();
        });

        function updateTimer() {
            const startMsStr = localStorage.getItem('countdown_start');
            
            // Якщо ще не запускали, показуємо початковий стан
            if (!startMsStr) {
                dayLabel.innerText = "DAY 1";
                countdownEl.innerText = "72:00:00";
                return;
            }

            const startMs = parseInt(startMsStr, 10);
            const now = Date.now();
            const elapsedMs = now - startMs;
            
            // Рахуємо який зараз день (1 день = 24 години)
            let dayNumber = Math.floor(elapsedMs / (24 * 60 * 60 * 1000)) + 1;
            // Обмежуємо максимум 3 днями (навіть якщо час вийде)
            if (dayNumber > 3) dayNumber = 3;
            
            dayLabel.innerText = `DAY ${dayNumber}`;

            // Рахуємо зворотній відлік
            const targetDate = startMs + DURATION_MS;
            const distance = targetDate - now;

            if (distance <= 0) {
                countdownEl.innerText = "00:00:00";
                return;
            }

            // Рахуємо загальну кількість годин (до 72)
            const hours = Math.floor(distance / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            const h = String(hours).padStart(2, '0');
            const m = String(minutes).padStart(2, '0');
            const s = String(seconds).padStart(2, '0');

            countdownEl.innerText = `${h}:${m}:${s}`;
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
